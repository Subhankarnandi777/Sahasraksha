; Sahasraksha-Edge (SIH26073) - PlatformIO project for ESP32 DevKit (WROOM-32)
; Build:   pio run            Flash: pio run -t upload       Monitor: pio device monitor
[env:esp32dev]
; pioarduino = maintained ESP32 platform with Arduino core 3.x (the exact platform this was compile-tested with)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    -O2
    -Wall
lib_deps =
    majicdesigns/MD_Parola@^3.7.3     ; MAX7219 text; pulls MD_MAX72XX. Remove + set USE_DISPLAY 0 if unused
